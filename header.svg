  <svg x="735" y="28" xmlns="http://www.w3.org/2000/svg" class="alfi" viewBox="0 0 20 18" width="190" height="171" shape-rendering="crispEdges" overflow="visible" aria-hidden="true"><style>@keyframes alfi-bob{0%,49.9%{transform:none}50%,100%{transform:translateY(-1px)}}@keyframes alfi-blink{0%,93%,100%{opacity:1}94%,98%{opacity:0}}@keyframes alfi-rise{0%{transform:translateY(1px);opacity:0}25%{opacity:1}100%{transform:translateY(-1px);opacity:0}}@keyframes alfi-twinkle{0%,100%{opacity:1}50%{opacity:.15}}@keyframes alfi-rain{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(2.5px);opacity:0}}@keyframes alfi-flash{0%,60%{opacity:1}61%,100%{opacity:.2}}@media (prefers-reduced-motion:reduce){.alfi,.alfi *{animation:none!important}}</style><g style="animation:alfi-bob 1.6s infinite"><path d="M7 3h4v1h-4zM5 4h8v1h-8zM14 4h3v1h-3zM4 5h14v1h-14zM2 6h17v1h-17zM1 7h18v1h-18zM1 8h18v1h-18zM1 9h18v1h-18zM1 10h18v1h-18z" fill="#FFFFFF"/><path d="M2 11h16v1h-16zM5 12h2v1h-2zM13 12h2v1h-2z" fill="#CFC9F2"/><path d="M6 7h1v1h-1zM13 7h1v1h-1zM5 8h1v1h-1zM7 8h1v1h-1zM12 8h1v1h-1zM14 8h1v1h-1zM8 9h1v1h-1zM11 9h1v1h-1zM9 10h2v1h-2z" fill="#1E1650"/><path d="M3 9h2v1h-2zM15 9h2v1h-2z" fill="#FF8A7A"/><path d="M2 1h1v1h-1zM1 2h3v1h-3zM2 3h1v1h-1z" fill="#6EF0C2" style="animation:alfi-twinkle 1.4s steps(2) infinite"/><path d="M17 1h1v1h-1z" fill="#6EF0C2" style="animation:alfi-twinkle 1.4s steps(2) -0.7s infinite"/></g></svg>
